name: Update guide

on:
  schedule:
    # Twice an hour. GitHub often delays or skips scheduled runs, so two slots per hour
    # keep DAZN's live listings fresh even when some runs are dropped.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write

# never run two updates at the same time (the second waits for the first)
concurrency:
  group: update-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the guide
        run: python3 build_epg.py

      - name: Publish if it changed
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add docs/
            git commit -m "Update guide $(date -u '+%F %H:%M')"
            git pull --rebase --quiet || true
            git push
          else
            echo "No change"
          fi
