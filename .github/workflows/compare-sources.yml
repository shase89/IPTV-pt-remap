name: Compare guide sources

on:
  workflow_dispatch: {}     # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XMLTV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xmltv xmltv-util
          ls /usr/bin | grep -i tv_grab_pt || echo "no Portuguese grabbers found"

      - name: Measure the guide you use today
        continue-on-error: true
        run: |
          mkdir -p work docs
          python3 compare.py stats baseline docs/epg.xml.gz > work/baseline.txt 2>&1 || true

      - name: Measure the Vodafone grabber
        continue-on-error: true
        run: |
          G=tv_grab_pt_vodafone
          N=vodafone
          {
            echo ""
            echo "=================== $G ==================="
            if ! command -v "$G" >/dev/null 2>&1; then
              echo "grabber is not installed on this runner"; exit 0
            fi
            "$G" --version 2>&1 | head -n 1
            # can the runner even reach Vodafone's site?
            curl -s -o /dev/null -m 20 -w "vodafone.pt reachable from the runner: HTTP %{http_code}\n" https://www.vodafone.pt/ || echo "vodafone.pt: no answer from the runner"
            # what does the grabber itself say?
            : > "work/$N.conf"
            timeout 300 "$G" --list-channels --config-file "work/$N.conf" --debug --output "work/$N.dbg.xml" 2>"work/$N.dbg.txt" || true
            echo "--- grabber messages while listing channels (first 40 lines) ---"
            head -n 40 "work/$N.dbg.txt"
            echo "channels in that listing: $(grep -c '<channel ' "work/$N.dbg.xml" 2>/dev/null || echo 0)"
            echo "--- end of grabber messages ---"
            # the grabber insists on an existing config file, even just to list channels
            : > "work/$N.conf"
            if ! timeout 600 "$G" --list-channels --config-file "work/$N.conf" --output "work/$N.channels.xml" --quiet 2>"work/$N.err1"; then
              echo "listing with an empty config failed:"; head -n 5 "work/$N.err1"
              echo "channel=0" > "work/$N.conf"
              timeout 600 "$G" --list-channels --config-file "work/$N.conf" --output "work/$N.channels.xml" --quiet 2>"work/$N.err1b" || {
                echo "listing with a dummy config failed too:"; head -n 10 "work/$N.err1b"; exit 0; }
            fi
            if [ ! -s "work/$N.channels.xml" ]; then
              echo "the channel list came back empty"; exit 0
            fi
            python3 compare.py conf "$N" "work/$N.channels.xml" "work/$N.conf"
            timeout 2400 "$G" --config-file "work/$N.conf" --days 7 --output "work/$N.xml" --quiet 2>"work/$N.err2" || true
            if [ ! -s "work/$N.xml" ]; then
              echo "(config-file attempt returned nothing; trying --channel)"
              timeout 2400 "$G" --config-file "work/$N.conf" --channel "$(python3 compare.py chlist "$N")" --days 7 --output "work/$N.xml" --quiet 2>"work/$N.err3" || true
            fi
            if [ ! -s "work/$N.xml" ]; then
              echo "grabbing FAILED:"; cat work/$N.err2 work/$N.err3 2>/dev/null | head -n 20; exit 0
            fi
            echo "--- grabber messages while grabbing (first 20 lines) ---"; head -n 20 "work/$N.err2" 2>/dev/null
            python3 compare.py stats "$N" "work/$N.xml"
          } > work/grabbers.txt 2>&1
          cat work/grabbers.txt | head -n 40

      - name: Write the report
        run: |
          {
            echo "Guide source comparison - $(date -u)"
            echo ""
            python3 compare.py summary || echo "summary failed"
            echo ""
            echo "################ DETAILS ################"
            cat work/baseline.txt 2>/dev/null
            cat work/grabbers.txt 2>/dev/null
          } > docs/compare-report.txt
          head -n 40 docs/compare-report.txt

      - name: Save the report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/compare-report.txt
          git commit -m "Guide source comparison" || echo "nothing to commit"
          git push || true
